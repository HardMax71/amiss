[files]
# Captured JSON keeps upstream spelling byte-for-byte.
extend-exclude = ["crates/amiss-fixtures/data/*.json"]

[default]
# base64url key material in test fixtures tokenizes into short words
extend-ignore-re = ["[A-Za-z0-9_-]{40,}"]

[type.json]
# Provider node IDs are opaque identifiers, not prose.
extend-ignore-re = ['"(?:[a-z_]+_)?node_id"\s*:\s*"[A-Za-z0-9_+/=-]+"']
