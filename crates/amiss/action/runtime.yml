name: Amiss Documentation Check
description: >-
  Checks documentation against the repository tree it describes and fails the
  run when a reference stops resolving.
branding:
  icon: check-circle
  color: gray-dark

inputs:
  profile:
    description: observe (findings do not block), enforce-introduced (introduced findings block, carried ones warn), or enforce (blocking findings fail the run)
    default: enforce
  base:
    description: >-
      full base commit id; when empty, pull requests derive the candidate's
      first parent and other events read the payload
    default: ""
  candidate:
    description: full candidate commit id; derived from the triggering event when empty
    default: ""
  repo:
    description: path to the repository root inside the workspace
    default: "."
  object-format:
    description: sha1 or sha256
    default: sha1
  annotations:
    description: emit candidate-located displayed Fixes and scan errors as file annotations
    default: "true"
  watchdog-seconds:
    description: wall-clock seconds the scan may take before it is ended with no result
    default: "120"

outputs:
  exit-class:
    description: the engine's exit class, 0, 1, or 2
    value: ${{ steps.verdict.outputs.exit-class }}
  report:
    description: path to the machine report, one canonical JSON line
    value: ${{ steps.verdict.outputs.report }}

runs:
  using: composite
  steps:
    # The engine ships inside this action tree and never leaves it: the ref
    # the workflow pinned is the whole supply chain, and the manifest in the
    # same tree must agree with the binary byte for byte before it runs.
    - id: select
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64) platform=linux-x86_64 ;;
          Linux/ARM64) platform=linux-aarch64 ;;
          macOS/ARM64) platform=macos-aarch64 ;;
          macOS/X64) platform=macos-x86_64 ;;
          Windows/X64) platform=windows-x86_64 ;;
          *)
            echo "::error title=amiss::unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}; the release carries linux-x86_64, linux-aarch64, macos-aarch64, macos-x86_64, windows-x86_64"
            exit 2
            ;;
        esac
        manifest="${ACTION_PATH}/release-manifest.json"
        if [ ! -f "$manifest" ]; then
          echo "::error title=amiss::this ref carries no release manifest; use a published action ref such as v0 or vX.Y.Z"
          exit 2
        fi
        row="$(jq -c --arg name "amiss-${platform}" \
          '.artifacts[] | select(.artifact_name == $name)' "$manifest")"
        if [ -z "$row" ]; then
          echo "::error title=amiss::the release manifest carries no artifact for ${platform}"
          exit 2
        fi
        tree_path="$(jq -r '.tree_path' <<<"$row")"
        expected="$(jq -r '.binary_sha256' <<<"$row")"
        binary="${ACTION_PATH}/${tree_path}"
        # hosted macOS guarantees shasum, not sha256sum; linux and windows have both
        if command -v sha256sum > /dev/null; then
          printf '%s  %s\n' "${expected#sha256:}" "$binary" | sha256sum -c - > /dev/null
        else
          printf '%s  %s\n' "${expected#sha256:}" "$binary" | shasum -a 256 -c - > /dev/null
        fi
        chmod +x "$binary"
        printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"

    # Base and candidate come from the event unless given. The event payload
    # values reach the script through the environment, never through ${{ }}
    # expansion into its body: a branch may be named anything, and text
    # expanded into a run block is code. For a pull request the base is the
    # merge commit's own first parent: the payload's base.sha races the lazily
    # rebuilt merge ref, and the ref is the one consistent source for the
    # pair, at any fetch depth.
    - id: derive
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_CANDIDATE: ${{ inputs.candidate }}
        INPUT_REPO: ${{ inputs.repo }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        MG_BASE: ${{ github.event.merge_group.base_sha }}
        MG_HEAD: ${{ github.event.merge_group.head_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
        REPOSITORY: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        BRANCH: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        set -euo pipefail
        repo() { git -C "$INPUT_REPO" "$@"; }
        # a pull_request_target checkout is the base branch, and the pull request's own objects are never fetched
        deepened=
        deepen() {
          [ -z "$deepened" ] && [ "$EVENT_NAME" != pull_request_target ] || return 1
          deepened=1
          [ "$(repo rev-parse --is-shallow-repository)" = true ] || return 1
          repo fetch --quiet --deepen=1 origin "$(repo rev-parse HEAD)"
        }
        present() {
          repo cat-file -e "$1^{commit}" 2>/dev/null && return 0
          deepen && repo cat-file -e "$1^{commit}" 2>/dev/null
        }
        base="$INPUT_BASE"
        candidate="$INPUT_CANDIDATE"
        if [ -z "$candidate" ]; then
          case "$EVENT_NAME" in
            merge_group) candidate="$MG_HEAD" ;;
            pull_request_target) candidate="$PR_HEAD" ;;
            *) candidate="$HEAD_SHA" ;;
          esac
        fi
        if [ -z "$base" ]; then
          case "$EVENT_NAME" in
            pull_request_target) base="$PR_BASE" ;;
            merge_group) base="$MG_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
        fi
        if [ -z "${base//0/}" ] || [ "$base" = "$candidate" ]; then
          base="$(repo rev-parse --verify --quiet "${candidate}^1" || true)"
          if [ -z "$base" ] && deepen; then
            base="$(repo rev-parse --verify --quiet "${candidate}^1" || true)"
          fi
        fi
        if [ -z "$base" ]; then
          echo "::error title=amiss::the checkout holds no parent of ${candidate}, so no base commit could be derived for a ${EVENT_NAME} event; give actions/checkout fetch-depth: 2"
          exit 2
        fi
        case "$EVENT_NAME" in
          pull_request) hint="give actions/checkout fetch-depth: 2" ;;
          pull_request_target) hint="a pull_request_target checkout is the base branch, so give actions/checkout ref: the pull request head sha (github.event.pull_request.head.sha) with fetch-depth: 0" ;;
          *) hint="give actions/checkout fetch-depth: 0" ;;
        esac
        for oid in "$base" "$candidate"; do
          if ! present "$oid"; then
            echo "::error title=amiss::commit ${oid} is not in the checkout; ${hint}"
            exit 2
          fi
        done
        {
          printf 'base=%s\n' "$base"
          printf 'candidate=%s\n' "$candidate"
        } >> "$GITHUB_OUTPUT"
        # a pull request or queue entry is checked as the branch it merges into will read
        BRANCH="${BRANCH#refs/heads/}"
        if [ -n "$BRANCH" ] && [ -n "$DEFAULT_BRANCH" ] \
          && { [ "$EVENT_NAME" != "push" ] || [ "$REF_TYPE" = "branch" ]; }; then
          host="${SERVER_URL#*://}"
          host="${host%/}"
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          {
            printf 'identity=%s/%s\n' "$(lower "$host")" "$(lower "$REPOSITORY")"
            printf 'ref=refs/heads/%s\n' "$BRANCH"
            printf 'default-ref=refs/heads/%s\n' "$DEFAULT_BRANCH"
          } >> "$GITHUB_OUTPUT"
        fi

    # The engine's resource ceilings bound its work, and a wall-clock watchdog
    # backstops them the way bootstrap's 120-second supervisor does on its
    # lane: a scan that outlives the window is ended and the run has no
    # result, never a verdict. The window is an input with a 120-second
    # default, and only a positive integer is accepted.
    - id: scan
      shell: bash
      env:
        BINARY: ${{ steps.select.outputs.binary }}
        BASE: ${{ steps.derive.outputs.base }}
        CANDIDATE: ${{ steps.derive.outputs.candidate }}
        IDENTITY: ${{ steps.derive.outputs.identity }}
        REF: ${{ steps.derive.outputs.ref }}
        DEFAULT_REF: ${{ steps.derive.outputs.default-ref }}
        INPUT_REPO: ${{ inputs.repo }}
        PROFILE: ${{ inputs.profile }}
        OBJECT_FORMAT: ${{ inputs.object-format }}
        WATCHDOG_SECONDS: ${{ inputs.watchdog-seconds }}
      run: |
        set -uo pipefail
        if [[ ! "$WATCHDOG_SECONDS" =~ ^[0-9]*[1-9][0-9]*$ ]]; then
          echo "::error title=amiss::watchdog-seconds must be a positive integer, got '${WATCHDOG_SECONDS}'"
          exit 2
        fi
        report="${RUNNER_TEMP}/amiss-report.json"
        fired="${RUNNER_TEMP}/amiss-watchdog-fired"
        rm -f "$fired"
        args=(check --repo "$INPUT_REPO" --object-format "$OBJECT_FORMAT"
              --base "$BASE" --candidate "$CANDIDATE"
              --profile "$PROFILE" --format json)
        if [ -n "${IDENTITY:-}" ]; then
          forge=github
          if [ "${GITEA_ACTIONS:-}" = true ] || [ "${FORGEJO_ACTIONS:-}" = true ]; then
            forge=gitea
          fi
          args+=(--repository "$IDENTITY" --ref "$REF" --default-branch-ref "$DEFAULT_REF"
                --forge "$forge")
        fi
        status=0
        "$BINARY" "${args[@]}" > "$report" &
        engine=$!
        ( sleep "$WATCHDOG_SECONDS"
          touch "$fired"
          kill -s TERM "$engine" 2>/dev/null
          sleep 5
          kill -s KILL "$engine" 2>/dev/null
        ) >/dev/null 2>&1 &
        watchdog=$!
        wait "$engine" || status=$?
        kill "$watchdog" 2>/dev/null || true
        if [ -e "$fired" ]; then
          rm -f "$report"
          echo "::error title=amiss::the scan crossed the ${WATCHDOG_SECONDS}-second wall-clock watchdog; the run ends with no result"
          status=2
        fi
        {
          printf 'exit-class=%s\n' "$status"
          if [ -s "$report" ]; then
            printf 'report=%s\n' "$report"
          else
            printf 'report=\n'
          fi
        } >> "$GITHUB_OUTPUT"
        if [ -s "$report" ]; then
          jq -r '
            def html: gsub("&"; "&amp;") | gsub("<"; "&lt;")
              | gsub(">"; "&gt;") | gsub("\""; "&quot;");
            def code: "<code>" + (tojson | .[1:-1] | html) + "</code>";
            def hex: map((. / 16 | floor) as $h | (. % 16) as $l
              | "0123456789abcdef"[$h:$h + 1] + "0123456789abcdef"[$l:$l + 1]) | join("");
            def target:
              if type == "string" then code
              elif type == "object" and .bytes != null then
                "<code>bytes " + (.bytes | hex) + "</code>"
              else "an unresolved destination"
              end;
            def where:
              if .annotation == null then ""
              else " at <code>" + (.annotation.path | tojson | .[1:-1] | html)
                + ":\(.annotation.span.start_line)</code>"
              end;
            def told($text): ($text // "") as $d
              | if $d == "" then "" else ": " + $d end;
            (.payload as $p
             | if $p.feedback.status == "available" then
                 ($p.feedback.items | map(select(.action == "fix")) | length) as $fixes
                 | ($p.feedback.items | map(select(.action == "check")) | length) as $checks
                 | ["amiss \($p.result.status): \($fixes) Fix, \($checks) Check, \($p.feedback.existing_count) Existing, exit class \($p.result.exit_code)",
                    (if ($p.feedback.items | length) > 0 then "" else empty end),
                    ($p.feedback.items[:10][]
                     | "- **\((.action[0:1] | ascii_upcase) + .action[1:])** "
                       + (.target | target)
                       + " \(.finding_kinds | join(", "))"
                       + where
                       + ", \(.location_count) affected place\(if .location_count == 1 then "" else "s" end)"),
                    (($p.feedback.items | length) - 10
                     | if . > 0 then
                         "- \(.) more item\(if . == 1 then "" else "s" end) in report."
                       else empty end)][]
               else
                 ($p.errors | group_by(.code)) as $errors
                 | ["amiss \($p.result.status): scan failed, \($p.result.error_count) errors, exit class \($p.result.exit_code)",
                    (if ($errors | length) > 0 then "" else empty end),
                    ($errors[]
                     | "- `\(.[0].code)`\(if length > 1 then " x\(length)" else "" end)"
                       + told(.[0].description))][]
               end)
          ' "$report" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "amiss produced no report, exit class ${status}"
        fi

    # Workflow commands are an injection surface, and repository paths are
    # repository-controlled, so every value is escaped per the command
    # grammar before it reaches stdout. A path only bytes can spell has no
    # file property; its hex is stated in the message. Each report row carries
    # its own typed feedback, so this step holds no finding text of its own.
    - id: annotate
      shell: bash
      env:
        ANNOTATIONS: ${{ inputs.annotations }}
        REPORT: ${{ steps.scan.outputs.report }}
      run: |
        set -euo pipefail
        wanted="$(printf '%s' "$ANNOTATIONS" | tr '[:upper:]' '[:lower:]')"
        if [ "$wanted" != "true" ] || [ ! -s "$REPORT" ]; then
          exit 0
        fi
        jq -r '
          def d: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
          def p: d | gsub(":"; "%3A") | gsub(","; "%2C");
          def hex: map((. / 16 | floor) as $h | (. % 16) as $l
            | "0123456789abcdef"[$h:$h + 1] + "0123456789abcdef"[$l:$l + 1]) | join("");
          def spelled:
            if type == "string" then d
            elif type == "object" and .bytes != null then "bytes \(.bytes | hex)"
            else empty end;
          def why($text): ($text // "") as $m
            | if $m == "" then "" else "; " + ($m|d) end;
          def led($lead): (spelled // "") | if . == "" then "" else $lead + . end;
          (.payload as $p
           | if $p.feedback.status == "available" then
               $p.feedback.items[:10][]
               | select(.action == "fix" and .annotation != null)
               | .annotation as $at
               | ([$p.findings[] | select(.location.path == $at.path and .location.span == $at.span)]
                  | first | .candidate_fact.evidence.resolution // {}) as $resolution
               | (if .effective_disposition == "fail" then "error" else "warning" end) as $level
               | "::\($level) file=\($at.path|p),line=\($at.span.start_line),endLine=\($at.span.end_line),col=\($at.span.start_column),endColumn=\($at.span.end_column),title=amiss Fix::Fix \(.finding_kinds | join(", "))"
                 + (.target | led(": target "))
                 + why($resolution.reason)
                 + ($resolution.near | led(", near "))
                 + ($resolution.same_object_at | led(", same bytes at "))
                 + "; \(.location_count) affected place\(if .location_count == 1 then "" else "s" end)"
             else
               $p.errors[:10][]
               | "::error title=amiss \(.code|d)::\(.code) in phase \(.phase)"
                 + (if (.path | type) == "string" then " at \(.path|d)"
                    elif .path_bytes != null then " at bytes \(.path_bytes | hex)"
                    else "" end)
                 + (if .resource != null then
                      " \(.resource|d) \(.configured_limit)/\(.observed_lower_bound)"
                    else "" end)
                 + why(.description)
             end)
        ' "$REPORT"

    # The report output always names the path, so an upload step never sees an
    # empty input; a run that wrote nothing leaves no file there.
    - id: verdict
      if: always()
      shell: bash
      env:
        STATUS: ${{ steps.scan.outputs.exit-class }}
      run: |
        set -euo pipefail
        status="${STATUS:-2}"
        report="${RUNNER_TEMP}/amiss-report.json"
        [ -s "$report" ] || rm -f "$report"
        {
          printf 'exit-class=%s\n' "$status"
          printf 'report=%s\n' "$report"
        } >> "$GITHUB_OUTPUT"
        exit "$status"
