[package]
name = "amiss"
version.workspace = true
edition.workspace = true
description = "Checks documentation against the repository tree it describes"
documentation = "https://hardmax71.github.io/amiss/"
homepage = "https://hardmax71.github.io/amiss/"
keywords = ["documentation", "ci", "links", "markdown", "drift"]
categories = ["development-tools", "command-line-utilities"]
license.workspace = true
repository.workspace = true
exclude.workspace = true

[package.metadata.binstall]
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/amiss-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/amiss-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/amiss-macos-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/amiss-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/amiss-windows-x86_64.exe"

[dependencies]
digest-io.workspace = true
js_int.workspace = true
percent-encoding.workspace = true
sha2.workspace = true
hex.workspace = true
amiss-git = { path = "../amiss-git", version = "0.29.1" }
amiss-md = { path = "../amiss-md", version = "0.29.1" }
amiss-scan = { path = "../amiss-scan", version = "0.29.1" }
amiss-wire = { path = "../amiss-wire", version = "0.29.1" }
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
strum.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
amiss-fixtures = { path = "../amiss-fixtures" }
dhat = "0.3"
jsonschema.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
