[package]
name = "amiss"
version.workspace = true
edition.workspace = true
description = "Checks documentation against the repository tree it describes"
documentation = "https://hardmax71.github.io/amiss/"
homepage = "https://hardmax71.github.io/amiss/"
keywords = ["documentation", "ci", "links", "markdown", "drift"]
categories = ["development-tools", "command-line-utilities"]
license.workspace = true
repository.workspace = true
exclude.workspace = true

[dependencies]
amiss-git = { path = "../amiss-git", version = "0.26.0" }
amiss-md = { path = "../amiss-md", version = "0.26.0" }
amiss-scan = { path = "../amiss-scan", version = "0.26.0" }
amiss-wire = { path = "../amiss-wire", version = "0.26.0" }
quick-xml.workspace = true
strum.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
amiss-fixtures = { path = "../amiss-fixtures" }
dhat = "0.3"
jsonschema.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
