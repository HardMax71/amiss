[package]
name = "amiss-bootstrap"
version.workspace = true
edition.workspace = true
description = "Trusted CI wrapper that validates and launches a verified Amiss engine"
license.workspace = true
repository.workspace = true
exclude.workspace = true

[dependencies]
amiss-git = { path = "../amiss-git", version = "0.27.0" }
amiss-wire = { path = "../amiss-wire", version = "0.27.0" }
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
serde_with = { workspace = true, features = ["std"] }
tempfile.workspace = true
thiserror.workspace = true
wary.workspace = true

[dev-dependencies]
amiss-fixtures = { path = "../amiss-fixtures" }
serde.workspace = true
tempfile.workspace = true

# The end-to-end wrapper test doubles as the engine the wrapper launches, so
# it needs its own main instead of the test harness.
[[test]]
name = "wrapper"
harness = false

[lints]
workspace = true
