[package]
name = "amiss-bootstrap"
version.workspace = true
edition.workspace = true
description = "Trusted CI wrapper that validates and launches a verified Amiss engine"
license.workspace = true
repository.workspace = true
exclude.workspace = true

[lib]
test = false

[dependencies]
digest-io.workspace = true
sha2.workspace = true
amiss-git = { path = "../amiss-git", version = "0.28.0" }
amiss-wire = { path = "../amiss-wire", version = "0.28.0" }
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde.workspace = true
amiss-fixtures = { path = "../amiss-fixtures" }
tempfile.workspace = true

# The end-to-end wrapper test doubles as the engine the wrapper launches, so
# it needs its own main instead of the test harness.
[[test]]
name = "wrapper"
harness = false

[lints]
workspace = true

[[bin]]
name = "amiss-bootstrap"
path = "src/main.rs"
test = false

[[bin]]
name = "amiss-manifest"
path = "src/bin/amiss-manifest.rs"
test = false
