name: pinned tools
description: Restore or fetch the cargo tool binaries pinned under workspace.metadata.tools, shared by every workflow.

runs:
  using: composite
  steps:
    - id: bench
      shell: bash
      run: |
        cargo metadata --locked --format-version 1 --no-deps --offline |
          jq -er '
            .metadata.tools |
            "prebuilt=\(.prebuilt | to_entries | map("\(.key)@\(.value)") | join(","))",
            "source=\(.source | to_entries | map("\(.key)@\(.value)") | join(" "))"
          ' >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/amiss-tools
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
      with:
        tool: ${{ steps.bench.outputs.prebuilt }}
        fallback: none
    # The source table's tools publish no prebuilt manifest.
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SOURCE_TOOLS: ${{ steps.bench.outputs.source }}
      run: cargo install --locked --root "${RUNNER_TOOL_CACHE}/amiss-tools" $SOURCE_TOOLS
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PREBUILT_TOOLS: ${{ steps.bench.outputs.prebuilt }}
      run: |
        mkdir -p "${RUNNER_TOOL_CACHE}/amiss-tools/bin"
        for entry in ${PREBUILT_TOOLS//,/ }; do
          cp "$(command -v "${entry%@*}")" "${RUNNER_TOOL_CACHE}/amiss-tools/bin/"
        done
    # The tool cache is the one directory the agent sandbox also puts on PATH,
    # and what sits under this fixed name is only the pinned installs above.
    - shell: bash
      run: echo "${RUNNER_TOOL_CACHE}/amiss-tools/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
