name: pinned tools
description: Restore or fetch the cargo tool binaries pinned under workspace.metadata.tools, shared by every workflow.

inputs:
  tools:
    description: Space-separated tool names; empty installs the whole declared bench.
    default: ''

runs:
  using: composite
  steps:
    - id: bench
      shell: bash
      env:
        REQUESTED_TOOLS: ${{ inputs.tools }}
      run: |
        cargo metadata --locked --format-version 1 --no-deps --offline |
          jq -er --arg requested "$REQUESTED_TOOLS" '
            ($requested | split(" ") | map(select(length > 0))) as $wanted |
            .metadata.tools as $tools |
            ($tools.prebuilt + $tools.source | keys) as $known |
            if ($wanted - $known | length) > 0
            then error("unknown tool selection") else $tools end |
            "key=\(. | to_entries | map("\(.key)-\(.value | to_entries | map("\(.key)@\(.value)") | join("-"))") | join("-"))",
            (map_values(with_entries(select($wanted == [] or (.key as $name | $wanted | index($name))))) |
              "prebuilt=\(.prebuilt | to_entries | map("\(.key)@\(.value)") | join(","))",
              "source=\(.source | to_entries | map("\(.key)@\(.value)") | join(" "))")
          ' >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/amiss-tools
        key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.bench.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true' && steps.bench.outputs.prebuilt != ''
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
      with:
        tool: ${{ steps.bench.outputs.prebuilt }}
        fallback: none
    # The source table's tools publish no prebuilt manifest.
    - if: steps.cache.outputs.cache-hit != 'true' && steps.bench.outputs.source != ''
      shell: bash
      env:
        SOURCE_TOOLS: ${{ steps.bench.outputs.source }}
      run: cargo install --locked --root "${RUNNER_TOOL_CACHE}/amiss-tools" $SOURCE_TOOLS
    - if: steps.cache.outputs.cache-hit != 'true' && steps.bench.outputs.prebuilt != ''
      shell: bash
      env:
        PREBUILT_TOOLS: ${{ steps.bench.outputs.prebuilt }}
      run: |
        mkdir -p "${RUNNER_TOOL_CACHE}/amiss-tools/bin"
        for entry in ${PREBUILT_TOOLS//,/ }; do
          cp "$(command -v "${entry%@*}")" "${RUNNER_TOOL_CACHE}/amiss-tools/bin/"
        done
    - if: inputs.tools == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/amiss-tools
        key: ${{ steps.cache.outputs.cache-primary-key }}
    # The tool cache is the one directory the agent sandbox also puts on PATH,
    # and what sits under this fixed name is only the pinned installs above.
    - shell: bash
      run: echo "${RUNNER_TOOL_CACHE}/amiss-tools/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
