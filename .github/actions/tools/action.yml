name: pinned tools
description: Restore or fetch the cargo tool binaries pinned under workspace.metadata.tools, shared by every workflow.

runs:
  using: composite
  steps:
    # Cargo.toml's tools tables are the single source: the cache key is the
    # hash of the extracted lists, so it moves exactly when a tool does.
    - id: bench
      shell: bash
      run: |
        prebuilt=$(sed -n '/^\[workspace\.metadata\.tools\.prebuilt\]/,/^\[workspace\.metadata\.tools\.source\]/{s/^\([a-z0-9-]*\) = "\(.*\)"/\1@\2/p}' Cargo.toml | paste -sd, -)
        source=$(sed -n '/^\[workspace\.metadata\.tools\.source\]/,${s/^\([a-z0-9-]*\) = "\(.*\)"/\1@\2/p}' Cargo.toml | paste -sd' ' -)
        key=$(printf '%s\n%s\n' "$prebuilt" "$source" | sha256sum | cut -c1-16)
        {
          printf 'prebuilt=%s\n' "$prebuilt"
          printf 'source=%s\n' "$source"
          printf 'key=%s\n' "$key"
        } >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo-tools
        key: tools-${{ runner.os }}-${{ steps.bench.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
      with:
        tool: ${{ steps.bench.outputs.prebuilt }}
    # The source table holds the tools that publish no prebuilt manifest; they
    # are the only compiles left on a cold cache.
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SOURCE_TOOLS: ${{ steps.bench.outputs.source }}
      run: cargo install --locked --root ~/.cargo-tools $SOURCE_TOOLS
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PREBUILT_TOOLS: ${{ steps.bench.outputs.prebuilt }}
      run: |
        mkdir -p "$HOME/.cargo-tools/bin"
        for entry in ${PREBUILT_TOOLS//,/ }; do
          cp "$(command -v "${entry%@*}")" "$HOME/.cargo-tools/bin/"
        done
    # Exporting the tool directory onto PATH is this composite's whole point. The
    # value is a fixed name under the runner's own HOME, and what sits inside it
    # is the pinned installs above, so nothing candidate-controlled is written.
    - shell: bash
      run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
