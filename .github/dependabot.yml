version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: libfuzzer-sys
      - dependency-name: arbitrary
    groups:
      fuzz-cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /controller
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      controller-cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - .github/workflows/agent-mention.lock.yml
      - .github/workflows/agent-review.lock.yml
      - .github/workflows/agent-triage.lock.yml
      - .github/workflows/agentic_commands.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: HardMax71/amiss
