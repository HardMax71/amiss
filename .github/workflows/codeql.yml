name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 6 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/changes.yml

  analyze:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    # The Rust analysis takes about ten minutes, so it runs on main and weekly;
    # every pull request still gets the workflow analysis and its CodeQL check.
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust extractor builds every build script and proc macro in the graph to load the workspace.
      - if: matrix.language == 'rust' && github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: codeql
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: (matrix.language == 'rust' && github.event_name != 'pull_request' && needs.changes.outputs.code == 'true') || (matrix.language == 'actions' && (github.event_name == 'pull_request' || needs.changes.outputs.actions == 'true'))
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - "**/tests/**"
              - "**/tests.rs"
              - "**/benches/**"
              - fuzz
              - controller/fuzz
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: (matrix.language == 'rust' && github.event_name != 'pull_request' && needs.changes.outputs.code == 'true') || (matrix.language == 'actions' && (github.event_name == 'pull_request' || needs.changes.outputs.actions == 'true'))
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/target
        with:
          category: "/language:${{ matrix.language }}"
