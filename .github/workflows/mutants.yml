name: mutants

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - run: cargo mutants --exclude 'controller/**'
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report
          path: mutants.out/

  controller-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        focus: [authentication, ownership-publication]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - if: matrix.focus == 'authentication'
        run: >-
          cargo mutants --test-tool nextest
          --file 'controller/src/ingress/policy.rs'
          --file 'controller/src/webhook/*.rs'
          --file 'controller/github/src/lib.rs'
          --file 'controller/gitea/src/source.rs'
          --file 'controller/gitlab/src/oidc.rs'
          --file 'controller/gitlab/src/oidc/claims.rs'
        continue-on-error: true
      - if: matrix.focus == 'ownership-publication'
        run: >-
          cargo mutants --test-tool nextest
          --file 'controller/src/orchestration/controller.rs'
          --file 'controller/src/orchestration/publication.rs'
          --file 'controller/gitea/src/adapter.rs'
          --file 'controller/gitlab/src/adapter.rs'
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-mutants-${{ matrix.focus }}
          path: mutants.out/
