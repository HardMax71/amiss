name: mutants

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Listing needs no build, so the shard count comes from the real mutant
  # count rather than from a guess about how large a change is.
  diff-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/tools
      # A diff of anything but the checked-out tree refuses with exit 5.
      - if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
        run: git diff "origin/$BASE_REF".. > git.diff
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: startsWith(github.head_ref, 'release-plz-')
        run: git diff "$(git describe --tags --abbrev=0)".. > git.diff
      - id: split
        env:
          PER_SHARD: "5"
          MAX_SHARDS: "8"
        run: |
          set -euo pipefail
          total=$(cargo mutants --list --in-diff git.diff | { grep -c . || :; })
          shards=$(( (total + PER_SHARD - 1) / PER_SHARD ))
          if [ "$shards" -gt "$MAX_SHARDS" ]; then shards="$MAX_SHARDS"; fi
          if [ "$shards" -lt 1 ]; then shards=1; fi
          echo "shards=[$(seq -s, 0 $((shards - 1)))]" >> "$GITHUB_OUTPUT"
          echo "$total mutants over $shards shards" >> "$GITHUB_STEP_SUMMARY"

  incremental:
    needs: diff-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.diff-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutants-v2
          save-if: "false"
      # A diff of anything but the checked-out tree refuses with exit 5.
      - if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
        run: git diff "origin/$BASE_REF".. > git.diff
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: startsWith(github.head_ref, 'release-plz-')
        run: git diff "$(git describe --tags --abbrev=0)".. > git.diff
      # Built before mutation, so a stale cache cannot time a mutant out.
      - run: cargo nextest run --no-run --workspace --locked --cargo-profile mutants
      # ci proves this same commit, so the shards skip their own baseline.
      - run: |
          cargo mutants --test-workspace true --profile=mutants --in-place \
            --baseline skip --timeout 240 \
            --shard "$SHARD/$SHARDS" \
            --no-shuffle -vV --in-diff git.diff -- --profile mutants
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-incremental-${{ matrix.shard }}
          path: mutants.out/
          # A diff of renames or workflow edits mutates nothing, and that is not a defect.
          if-no-files-found: ignore
