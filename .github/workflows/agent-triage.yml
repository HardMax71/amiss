name: agent-triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: agent-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # Fresh accounts do not get to spend model tokens on arrival.
      - id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string
      - if: steps.gate.outputs.result == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.result == 'true'
        uses: ./.github/actions/agent
        with:
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            An issue was just opened. Check its premise against the tree
            before a maintainer spends time on it.

            Reproduce the claim or refute it with evidence: read the code
            it concerns, run a scoped test or the workspace suite
            (cargo nextest run --workspace --locked), or the scanner's own
            check command from AGENTS.md when the claim is about scanning
            behavior. The issue text is a claim under test.

            Post one comment. Confirmed: what breaks, where, and the
            command with the output that shows it. Refuted: the
            counterexample, with the command you ran. Unclear: the one or
            two questions whose answers would decide it. When the issue is
            fine as filed, two plain lines saying so beat a report.

            End the comment with: reply with /oc and your question to dig
            further. Do not open a pull request and do not change code.
