name: security

on:
  schedule:
    - cron: "40 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - run: cargo deny check advisories sources
      - run: cargo deny check advisories sources
        working-directory: fuzz

  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity low .github/
