name: mutants-baseline

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mutants-baseline
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  # Refreshes the build cache the PR shards restore.
  baseline:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
        with:
          tools: cargo-nextest
      - run: rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mutants-v2
          save-if: "true"
      - run: cargo nextest run --workspace --locked --cargo-profile mutants
