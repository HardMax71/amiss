name: mutants-baseline

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mutants-baseline
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refreshes the build cache the PR shards restore.
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: mutants-v2
          save-if: "true"
      - run: cargo nextest run --workspace --locked --cargo-profile mutants
