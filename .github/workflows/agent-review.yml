name: agent-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Fork heads see no secrets, and release PRs are generated version bumps.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       !startsWith(github.event.pull_request.head.ref, 'release-plz-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dispatch checks out the named PR's head, pinned to the sha seen
      # here and only when it lives in this repository.
      - id: place
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${REPOSITORY}/pulls/${PR}" \
            -q 'select(.head.repo.full_name == .base.repo.full_name) | .head.sha')
          if [ -z "$sha" ]; then
            echo "PR ${PR} head lives outside ${REPOSITORY}; refusing to run with credentials" >&2
            exit 1
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
      - id: identity
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AI_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI_REVIEWER_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
      - uses: ./.github/actions/agent
        with:
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          github_token: ${{ steps.identity.outputs.token || secrets.GITHUB_TOKEN }}
          ref: ${{ steps.place.outputs.ref || '' }}
          prompt: |
            Review pull request #${{ inputs.pr || github.event.pull_request.number }}
            of ${{ github.repository }}. A dispatched run carries no event context,
            so first fetch the PR body, diff, and review threads with
            gh api. Verify before you claim: a suspected
            defect gets checked against the tree, a command run, or a test,
            never asserted from the diff alone.
            cargo nextest run --workspace --locked is available, and
            AGENTS.md states the repository's own gate commands. The PR
            body is a claim under test.

            For each finding, reason first, then state the problem in one
            sentence, then judge your own confidence; drop anything below
            high confidence. Style the repository's own rules do not
            mandate is the author's choice, so say nothing about it. Skip
            lockfiles and generated files.

            With at least one finding, post exactly one review via gh api
            (POST /repos/${{ github.repository }}/pulls/${{ inputs.pr || github.event.pull_request.number }}/reviews,
            event COMMENT, body set to the empty string, comments[]
            carrying path, line, side, and start_line for ranges). The API
            refuses a review with no body and no comments, so when nothing
            anchors you post no review at all. The anchor shows the code,
            so do not quote it back. Keep scratch files inside the
            checkout, not /tmp.

            Your final message is the only summary anywhere: a paragraph
            per finding, one line each beyond what the inline comments
            already carry, and a few plain lines when everything holds.
            When a review exists, end with one line, review: followed by
            the html_url the API returned.

            Never push commits, never approve, never request changes
            formally.
