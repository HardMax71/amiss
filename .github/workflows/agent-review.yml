name: agent-review

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork heads see no secrets, and release PRs are generated version bumps.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !startsWith(github.event.pull_request.head.ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/agent
        with:
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request as a skeptical maintainer of this
            repository. The PR body states what changed and why; verify those
            claims against the diff and the tree instead of trusting them.
            Gather evidence where it is cheap: run
            cargo nextest run --workspace --locked when the change touches
            code, and read AGENTS.md for the repository's own gate commands.
            Then post one review comment: discrepancies first with file and
            line, then anything the diff changes that its text does not
            mention, then a short confirmation of what held up. If everything
            checks out, say so in a few lines. Do not push commits, do not
            approve, and do not request changes formally.
