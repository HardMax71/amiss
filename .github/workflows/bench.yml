name: bench

on:
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: bench
      - shell: bash
        run: cargo bench --workspace --locked 2>&1 | tee benches.txt
      - shell: bash
        run: >-
          cargo nextest run -p amiss-scan --test suite --release --locked
          -E 'test(/^eligibility::/)' --no-capture 2>&1 | tee eligibility.txt
      - shell: bash
        run: >-
          cargo nextest run -p amiss-scan --test measure --release --locked
          --run-ignored ignored-only --no-capture 2>&1 | tee measurement.txt
      - shell: bash
        run: >-
          cargo nextest run
          -p amiss-controller --test file_ledger --release --locked
          --run-ignored ignored-only --no-capture 2>&1 | tee controller-ledger.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-evidence
          path: |
            benches.txt
            controller-ledger.txt
            eligibility.txt
            measurement.txt
