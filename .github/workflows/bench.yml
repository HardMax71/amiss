name: bench

on:
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
        with:
          tools: cargo-nextest
      - run: rustup toolchain uninstall stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
      - shell: bash
        run: cargo bench --workspace --locked 2>&1 | tee benches.txt
      - shell: bash
        run: >-
          cargo nextest run -p amiss-scan --test eligibility --release --locked
          --no-capture 2>&1 | tee eligibility.txt
      - shell: bash
        run: >-
          cargo nextest run -p amiss-scan --test measure --release --locked
          --run-ignored ignored-only --no-capture 2>&1 | tee measurement.txt
      - shell: bash
        run: >-
          cargo nextest run
          -p amiss-controller --test file_ledger --release --locked
          --run-ignored ignored-only --no-capture 2>&1 | tee controller-ledger.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-evidence
          path: |
            benches.txt
            controller-ledger.txt
            eligibility.txt
            measurement.txt
