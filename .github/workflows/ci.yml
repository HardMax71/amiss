name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  json-contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          cargo test -p amiss-wire --test json_contracts --locked
      - name: Check generated scanner reports
        run: cargo test -p amiss-scan --test suite --test fatal_envelope --locked
      - run: >-
          cargo test -p amiss --test documentation_contracts --locked

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/tools
      # Branch runs only restore; main saves the pruned caches, so lock bumps
      # on branches cannot crowd the shared budget and evict small entries.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          shared-key: gates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: similarity
        name: Derive the similarity comparison
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            merge_group) base="$MERGE_BASE" ;;
            push) base="$BEFORE" ;;
            *) echo "unsupported similarity event: $EVENT" >&2; exit 1 ;;
          esac
          if [[ ! "$base" =~ ^0+$ ]]; then
            git cat-file -e "$base^{commit}"
            base_tree="$(git rev-parse "$base^{tree}")"
          else
            base_tree=empty
          fi
          policy="$(scripts/similarity-gate.sh --policy)"
          cache_safe=true
          if [[ "$EVENT" == pull_request ]] || [[ "$base_tree" == empty ]]; then
            cache_safe=false
          elif ! git diff --quiet "$base" HEAD -- \
            .github/workflows/ci.yml .pre-commit-config.yaml \
            scripts/similarity-gate.sh Cargo.toml Cargo.lock; then
            cache_safe=false
          fi
          {
            echo "base=$base"
            echo "base_tree=$base_tree"
            echo "current_tree=$(git rev-parse HEAD^{tree})"
            echo "policy=$policy"
            echo "cache_safe=$cache_safe"
          } >> "$GITHUB_OUTPUT"
      - id: similarity-cache
        name: Restore the base similarity manifest
        if: steps.similarity.outputs.cache_safe == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/amiss-similarity/manifest
          key: similarity-v1-${{ steps.similarity.outputs.policy }}-${{ steps.similarity.outputs.base_tree }}
      - run: prek run --all-files
      # The suites belong to platform-tests, on every platform rather than this one.
      - run: prek run --all-files --hook-stage pre-push
        env:
          AMISS_SIMILARITY_BASE: ${{ steps.similarity.outputs.base }}
          AMISS_SIMILARITY_BASE_MANIFEST: ${{ runner.temp }}/amiss-similarity/manifest
          AMISS_SIMILARITY_CURRENT_MANIFEST: ${{ runner.temp }}/amiss-similarity/current.manifest
          AMISS_SIMILARITY_CURRENT_TREE: ${{ steps.similarity.outputs.current_tree }}
          AMISS_SIMILARITY_POLICY: ${{ steps.similarity.outputs.policy }}
          SKIP: nextest
      - run: rustup toolchain install nightly-2026-08-28 --profile minimal
      - run: rustup target add --toolchain nightly-2026-08-28 wasm32-unknown-unknown
      - run: >-
          cargo test -p amiss-api
          normalize::tests::real::cargo_configurations_preserve_record_boundaries
          --locked -- --ignored --exact
        env:
          AMISS_RUSTDOC_TOOLCHAIN: nightly-2026-08-28
      - id: current-similarity-cache
        name: Find the current similarity manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: ${{ runner.temp }}/amiss-similarity/manifest
          key: similarity-v1-${{ steps.similarity.outputs.policy }}-${{ steps.similarity.outputs.current_tree }}
      - name: Stage the current similarity manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.current-similarity-cache.outputs.cache-hit != 'true'
        shell: bash
        run: install -D -m 0644 "${{ runner.temp }}/amiss-similarity/current.manifest" "${{ runner.temp }}/amiss-similarity/manifest"
      - name: Save the current similarity manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.current-similarity-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/amiss-similarity/manifest
          key: similarity-v1-${{ steps.similarity.outputs.policy }}-${{ steps.similarity.outputs.current_tree }}

  # The scanner reads its own repository under enforce, through the very
  # action a consumer pins: the engine is built from this pull request, the
  # tree is assembled with the release recipe, and the composite derives the
  # commits, verifies the manifest, runs, and annotates. One job dogfoods the
  # engine and the whole distribution lane.
  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests check out at the consumer default of 2 so every PR
          # records the shallow path; a push can move main by several commits,
          # and the event's before must be in the checkout, so pushes stay 0.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release -p amiss -p amiss-bootstrap
      - shell: bash
        env:
          SERVER_URL: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p action-tree/dist
          cp Cargo.lock action-tree/Cargo.lock
          cp LICENSE.md action-tree/LICENSE.md
          bash scripts/release-licenses.sh action-tree/THIRD_PARTY_LICENSES.txt
          install -m 0644 crates/amiss/action/runtime.yml action-tree/action.yml
          install -m 0755 target/release/amiss action-tree/dist/amiss-linux-x86_64
          HOST="${SERVER_URL#*://}"
          HOST="${HOST%/}"
          ./target/release/amiss-manifest \
            --tree action-tree \
            --version 0.0.0-smoke \
            --host "$HOST" \
            --owner "${OWNER,,}" \
            --repository "$(basename "$REPOSITORY")" \
            --commit "$COMMIT" \
            --lock Cargo.lock \
            --action action.yml \
            --artifact dist/amiss-linux-x86_64
      - id: action
        uses: ./action-tree
        with:
          profile: enforce
      - if: always() && steps.action.outputs.report != ''
        shell: bash
        env:
          EXIT_CLASS: ${{ steps.action.outputs.exit-class }}
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          set -eu
          echo "exit class ${EXIT_CLASS}"
          jq -e '.schema == "amiss/scanner-report-envelope"' "$REPORT" > /dev/null
          jq -e '.payload.schema == "amiss/scanner-report-payload"' "$REPORT" > /dev/null
          jq -e '.payload.feedback.status == "available"' "$REPORT" > /dev/null
          jq -e '.payload.evaluation.forge == "github"' "$REPORT" > /dev/null
          jq -e '.payload.documents | length > 0' "$REPORT" > /dev/null
      # The staged-index lane in hosted CI: the checkout's clean index against
      # the parent commit, recording that event-matrix row on every run.
      - shell: bash
        run: |
          set -eu
          ./target/release/amiss check --repo . --object-format sha1 \
            --base "$(git rev-parse HEAD^)" --index \
            --profile observe --format json > /dev/null

  # The external rail on this repository's own changes, advisory: the chain
  # runs check, external-plan, amiss-probe, and external-assess against the
  # base, and the assessment lands in the step summary as telemetry for the
  # enforcement decision. Nothing here may fail the suite, so every defect
  # degrades into one summary line and exit zero.
  external-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: external-evidence-cache
        name: Restore retry-local external evidence
        if: github.run_attempt != '1'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/amiss-external/evidence.json
          key: external-evidence-v1-amiss-probe-default-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            external-evidence-v1-amiss-probe-default-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.sha }}-
      - id: external-advisory
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          advisory() {
            echo "advisory external rail: $1" >> "$GITHUB_STEP_SUMMARY"
            echo "advisory external rail: $1"
            exit 0
          }
          # base.sha races the rebuilt merge ref; the merge commit's first parent does not
          if [ "$EVENT" = pull_request ]; then
            BASE="$(git rev-parse HEAD^1)"
          fi
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            advisory "no usable base commit for this event"
          fi
          cargo build --locked --release -p amiss -p amiss-probe \
            || advisory "the binaries did not build"
          HOST="${SERVER_URL#*://}"
          HOST="${HOST%/}"
          REF="${HEAD_REF:+refs/heads/$HEAD_REF}"
          REF="${REF:-$EVENT_REF}"
          ./target/release/amiss check --repo . --object-format sha1 \
            --base "$BASE" --candidate "$(git rev-parse HEAD)" \
            --repository "$HOST/${REPOSITORY,,}" \
            --ref "$REF" \
            --default-branch-ref "refs/heads/$DEFAULT_BRANCH" \
            --forge github \
            --profile observe --format json > report.json \
            || advisory "the scan could not complete"
          ./target/release/amiss external-plan --report report.json --format json > plan.json \
            || advisory "the plan could not derive"
          evidence_root="${RUNNER_TEMP}/amiss-external"
          evidence="$evidence_root/evidence.json"
          pending="$evidence_root/evidence.pending"
          mkdir -p "$evidence_root"
          produced=false
          if [ -f "$evidence" ] \
            && ./target/release/amiss external-assess \
              --plan plan.json --evidence "$evidence" > assessment.txt 2>/dev/null
          then
            source=cache
          else
            ./target/release/amiss-probe --plan plan.json > "$pending" \
              || advisory "the probe could not run"
            mv "$pending" "$evidence"
            ./target/release/amiss external-assess --plan plan.json --evidence "$evidence" \
              > assessment.txt || advisory "the assessment could not judge"
            produced=true
            source=fresh
          fi
          jq -er '"cacheable=\(.rows | length > 0)"' "$evidence" \
            >> "$GITHUB_OUTPUT" || advisory "the evidence row count is unavailable"
          echo "produced=$produced" >> "$GITHUB_OUTPUT"
          echo "advisory external rail: external evidence source: $source"
          cat assessment.txt
          {
            echo "external evidence source: $source"
            echo '```'
            cat assessment.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save retry-local external evidence
        if: >-
          steps.external-advisory.outputs.cacheable == 'true' &&
          steps.external-advisory.outputs.produced == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/amiss-external/evidence.json
          key: external-evidence-v1-amiss-probe-default-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.sha }}-${{ github.run_attempt }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify the scanner fuzz lockfile
        run: cargo test --locked --release
        working-directory: fuzz
      - name: Run the controller fuzz smoke
        run: cargo test --locked --release
        working-directory: controller/fuzz
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path controller/fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check
      - run: cargo shear --locked fuzz

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo publish --dry-run prefers a version already on crates.io over the
      # tree, so it cannot verify a crate this change is adding to.
      - shell: bash
        run: |
          set -euo pipefail
          mapfile -t members < <(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish == null) | "-p\n\(.name)"')
          cargo package --locked "${members[@]}"

  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Real-time scanning reads every artifact cargo writes and every process
      # the lane tests spawn, on a runner that is discarded after this job.
      - if: runner.os == 'Windows'
        name: Stop Defender scanning the build
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - id: bench
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --no-deps --offline |
            jq -er '"nextest=\(.metadata.tools.prebuilt["cargo-nextest"])"' >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@${{ steps.bench.outputs.nextest }}
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo nextest run --workspace --locked
      - run: cargo nextest run -p amiss-scan --test suite -E 'test(/^eligibility::/)' --release --locked

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustup component add llvm-tools-preview
      - run: cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
      - run: cargo llvm-cov report --fail-under-lines 85
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
