[package]
name = "amiss-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[patch.crates-io]
markdown = { path = "../third_party/markdown-rs-1.0.0" }

[dependencies]
amiss-git = { path = "../crates/amiss-git" }
amiss-scan = { path = "../crates/amiss-scan" }
amiss-wire = { path = "../crates/amiss-wire" }
libfuzzer-sys = { version = "0.4", optional = true }

[features]
harness = ["dep:libfuzzer-sys"]

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false
required-features = ["harness"]

[[bin]]
name = "controls"
path = "fuzz_targets/controls.rs"
test = false
doc = false
bench = false
required-features = ["harness"]

[[bin]]
name = "requests"
path = "fuzz_targets/requests.rs"
test = false
doc = false
bench = false
required-features = ["harness"]

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false
required-features = ["harness"]

[[bin]]
name = "git_index"
path = "fuzz_targets/git_index.rs"
test = false
doc = false
bench = false
required-features = ["harness"]

[[bin]]
name = "git_objects"
path = "fuzz_targets/git_objects.rs"
test = false
doc = false
bench = false
required-features = ["harness"]

[[bin]]
name = "human"
path = "fuzz_targets/human.rs"
test = false
doc = false
bench = false
required-features = ["harness"]

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "warn"
disallowed_types = "deny"
disallowed_methods = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
wildcard_enum_match_arm = "deny"
mem_forget = "deny"
iter_over_hash_type = "warn"
map_err_ignore = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
exit = "deny"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "deny"
mod_module_files = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
debug = 1

[[bin]]
name = "claim"
path = "fuzz_targets/claim.rs"
test = false
doc = false
bench = false
required-features = ["harness"]
