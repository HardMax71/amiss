[workspace]
resolver = "3"
members = [
  "crates/amiss",
  "crates/amiss-bootstrap",
  "crates/amiss-fixtures",
  "crates/amiss-adoc",
  "crates/amiss-git",
  "crates/amiss-md",
  "crates/amiss-rst",
  "crates/amiss-scan",
  "crates/amiss-wire",
  "controller",
  "controller/bootstrap-fixture",
  "controller/constraint",
  "controller/files",
  "controller/fixtures",
  "controller/fuzz",
  "controller/git",
  "controller/gitea",
  "controller/gitea-service",
  "controller/github",
  "controller/github-service",
  "controller/gitlab",
  "controller/gitlab-service",
  "controller/service",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.97"
license = "FSL-1.1-ALv2"
repository = "https://github.com/HardMax71/amiss"
# Tests reach for the unpublished fixtures crate and the repository corpus, so a consumer cannot run them.
exclude = ["/tests", "/benches"]

[workspace.dependencies]
amiss-controller-bootstrap-fixture = { path = "controller/bootstrap-fixture" }
amiss-controller-fixtures = { path = "controller/fixtures" }
atomicwrites = "0.4.4"
aws-lc-rs = "1.17.3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
cap = "0.1.2"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
divan = "0.1.21"
flate2 = "1"
getrandom = "0.4.3"
hex = "0.4"
hmac = "0.13"
jsonschema = { version = "0.48", default-features = false, features = ["resolve-file"] }
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs", "use_pem"] }
pem = "3.0.6"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1-checked = "0.10"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
tokio = "1.53.1"
tower = { version = "0.5.3", features = ["util"] }
unicode-general-category = "1.1"
unicode-normalization = "0.1"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
# no-panic contract; clippy.toml exempts tests
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "warn"
# type discipline: no erasure, no lossy casts, no wildcard arms on closed enums
disallowed_types = "deny"
disallowed_methods = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
wildcard_enum_match_arm = "deny"
mem_forget = "deny"
iter_over_hash_type = "warn"
map_err_ignore = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
# output and exit are wire contract
exit = "deny"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "deny"
mod_module_files = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
overflow-checks = true
panic = "unwind"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.release.package.amiss-controller-fuzz]
debug = 1

# Full DWARF was 96% of every test binary and 14.5 MB of the 15.2 MB lane fixture.
[profile.dev]
debug = "line-tables-only"

# Debug builds keep debug assertions but optimize the library crates, so the
# large-envelope goldens and parser-heavy tests run in seconds, not minutes.
[profile.dev.package.amiss-wire]
opt-level = 2

[profile.dev.package.amiss-scan]
opt-level = 2

[profile.dev.package.amiss-md]
opt-level = 2

[profile.dev.package.markdown]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2
