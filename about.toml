targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
private = { ignore = true }
# Apache-2.0 leads since its text needs no copyright line to be whole.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "NCSA",
  "FSL-1.1-ALv2",
]
