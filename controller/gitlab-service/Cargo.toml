[package]
name = "amiss-controller-gitlab-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deployable GitLab merge-train policy lane for the Amiss controller"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "amiss-controller-gitlab"
path = "src/main.rs"

[[bin]]
name = "amiss-gitlab-service-bootstrap-fixture"
path = "tests/fixtures/bootstrap.rs"
test = false
bench = false

[dependencies]
amiss-controller = { path = ".." }
amiss-controller-bootstrap-fixture.workspace = true
amiss-controller-git = { path = "../git" }
amiss-controller-gitlab = { path = "../gitlab" }
amiss-controller-service = { path = "../service" }
amiss-git = { path = "../../crates/amiss-git" }
amiss-wire = { path = "../../crates/amiss-wire" }
axum.workspace = true
secrecy.workspace = true
serde.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time"] }

[dev-dependencies]
amiss-bootstrap = { path = "../../crates/amiss-bootstrap" }
amiss-controller-fixtures.workspace = true
amiss-fixtures = { path = "../../crates/amiss-fixtures" }
jsonwebtoken.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tower.workspace = true

[lints]
workspace = true
