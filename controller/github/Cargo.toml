[package]
name = "amiss-controller-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GitHub pull-request adapter for the Amiss controller"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
amiss-controller = { path = ".." }
amiss-controller-git = { path = "../git" }
amiss-wire = { path = "../../crates/amiss-wire" }
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs", "use_pem"] }
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
url = "2"

[dev-dependencies]
amiss-controller-fixtures.workspace = true
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
tempfile = "3"

[lints]
workspace = true
