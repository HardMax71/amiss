[package]
name = "amiss-controller-gitea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Gitea-family pull-request adapter for the Amiss controller"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
amiss-controller = { path = ".." }
amiss-wire = { path = "../../crates/amiss-wire" }
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"

[lints]
workspace = true
