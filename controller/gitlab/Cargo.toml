[package]
name = "amiss-controller-gitlab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GitLab merge-train policy adapter for the Amiss controller"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
amiss-controller = { path = ".." }
amiss-wire = { path = "../../crates/amiss-wire" }
jsonwebtoken = { version = "10.4", default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
amiss-controller-fixtures.workspace = true

[lints]
workspace = true
