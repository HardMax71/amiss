[package]
name = "amiss-controller-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
amiss-controller = { path = ".." }
amiss-controller-fixtures.workspace = true
amiss-controller-gitea = { path = "../gitea" }
amiss-controller-github = { path = "../github" }
amiss-controller-gitlab = { path = "../gitlab" }
amiss-wire = { path = "../../crates/amiss-wire" }
hex.workspace = true
hmac.workspace = true
jsonwebtoken.workspace = true
libfuzzer-sys = { version = "0.4", optional = true }
serde_json.workspace = true
sha2.workspace = true

[features]
harness = ["dep:libfuzzer-sys"]

[[bin]]
name = "provider_webhooks"
path = "fuzz_targets/provider_webhooks.rs"
test = false
doc = false
bench = false
required-features = ["harness"]

[[bin]]
name = "gitlab_oidc"
path = "fuzz_targets/gitlab_oidc.rs"
test = false
doc = false
bench = false
required-features = ["harness"]

[dev-dependencies]
amiss-fixtures = { path = "../../crates/amiss-fixtures" }

[lints]
workspace = true
