[package]
name = "amiss-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider-neutral orchestration contracts for Amiss runs"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "amiss-bootstrap-fixture"
path = "tests/fixtures/bootstrap.rs"
test = false
bench = false

[dependencies]
amiss-bootstrap = { path = "../crates/amiss-bootstrap" }
amiss-controller-files = { path = "files" }
amiss-git = { path = "../crates/amiss-git" }
amiss-rst = { path = "../crates/amiss-rst" }
amiss-wire = { path = "../crates/amiss-wire" }
atomicwrites.workspace = true
base64.workspace = true
cap-std.workspace = true
countio.workspace = true
flate2.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
html5gum.workspace = true
json-serde.workspace = true
percent-encoding.workspace = true
processkit = { version = "=3.3.4", features = ["stats"] }
same-file = "1"
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde_json_canonicalizer.workspace = true
serde_with.workspace = true
sha2.workspace = true
sphinx_inv.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
url.workspace = true

[dev-dependencies]
amiss-controller-fixtures.workspace = true
amiss-fixtures = { path = "../crates/amiss-fixtures" }

[lints]
workspace = true
