[package]
name = "amiss-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider-neutral orchestration contracts for Amiss runs"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "amiss-bootstrap-fixture"
path = "tests/fixtures/bootstrap.rs"
test = false
bench = false

[dependencies]
amiss-bootstrap = { path = "../crates/amiss-bootstrap" }
amiss-git = { path = "../crates/amiss-git" }
amiss-wire = { path = "../crates/amiss-wire" }
atomicwrites.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
processkit = { version = "=2.3.1", features = ["stats"] }
same-file = "1"
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
amiss-fixtures = { path = "../crates/amiss-fixtures" }

[lints]
workspace = true
