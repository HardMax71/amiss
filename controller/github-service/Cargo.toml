[package]
name = "amiss-controller-github-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deployable GitHub provider lane for the Amiss controller"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "amiss-controller-github"
path = "src/main.rs"

[[bin]]
name = "amiss-github-service-bootstrap-fixture"
path = "tests/fixtures/bootstrap.rs"
test = false
bench = false

[dependencies]
amiss-bootstrap = { path = "../../crates/amiss-bootstrap" }
amiss-controller = { path = ".." }
amiss-controller-github = { path = "../github" }
amiss-controller-service = { path = "../service" }
amiss-wire = { path = "../../crates/amiss-wire" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
amiss-controller-fixtures.workspace = true
amiss-fixtures = { path = "../../crates/amiss-fixtures" }
hex = "0.4"
hmac = "0.13"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[lints]
workspace = true
