[package]
name = "amiss-controller-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Exact Git acquisition for Amiss provider controllers"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
amiss-controller = { path = ".." }
amiss-wire = { path = "../../crates/amiss-wire" }
flate2.workspace = true
gix = { version = "0.85", default-features = false, features = [
  "blocking-http-transport-reqwest-rust-tls",
  "sha1",
] }
gix-pack = { version = "0.72", features = ["sha1"] }
secrecy.workspace = true
tempfile.workspace = true

[dev-dependencies]
amiss-fixtures = { path = "../../crates/amiss-fixtures" }

[lints]
workspace = true
