[package]
name = "amiss-controller-constraint"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Offline producer for Amiss provider execution constraints"
license = "FSL-1.1-ALv2"
repository = "https://github.com/HardMax71/amiss"
publish = false

[[bin]]
name = "amiss-constraint"
path = "src/main.rs"

[dependencies]
amiss-bootstrap = { path = "../../crates/amiss-bootstrap" }
amiss-controller-files = { path = "../files" }
amiss-git = { path = "../../crates/amiss-git" }
amiss-wire = { path = "../../crates/amiss-wire" }
tempfile = "3"

[dev-dependencies]
amiss-fixtures = { path = "../../crates/amiss-fixtures" }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
wildcard_enum_match_arm = "deny"
mem_forget = "deny"
dbg_macro = "deny"
